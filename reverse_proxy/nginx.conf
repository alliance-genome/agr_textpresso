user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    server_names_hash_bucket_size  128;
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    client_max_body_size 100000M;
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    types_hash_max_size 4096;

    # Avoid 505 HTTP Timeout Errors
    proxy_connect_timeout       605;
    proxy_send_timeout          605;
    proxy_read_timeout          605;
    send_timeout                605;
    keepalive_timeout           605;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=search:10m rate=10r/m;

    # Map to identify bots to block
    map $http_user_agent $block_ua {
        default 0;
        # AI/ML bots (your existing list)
        ~*AdsBot-Google 1;
        ~*Amazonbot 1;
        ~*anthropic-ai 1;
        ~*Applebot 1;
        ~*Applebot-Extended 1;
        ~*AwarioRssBot 1;
        ~*AwarioSmartBot 1;
        ~*Bytespider 1;
        ~*CCBot 1;
        ~*ChatGPT-User 1;
        ~*ClaudeBot 1;
        ~*Claude-Web 1;
        ~*cohere-ai 1;
        ~*DataForSeoBot 1;
        ~*Diffbot 1;
        ~*FacebookBot 1;
        ~*FriendlyCrawler 1;
        ~*Google-Extended 1;
        ~*GoogleOther 1;
        ~*GPTBot 1;
        ~*img2dataset 1;
        ~*ImagesiftBot 1;
        ~*magpie-crawler 1;
        ~*Meltwater 1;
        ~*omgili 1;
        ~*omgilibot 1;
        ~*peer39_crawler 1;
        ~*PerplexityBot 1;
        ~*PiplBot 1;
        ~*scoop\.it 1;
        ~*Seekr 1;
        ~*YouBot 1;

        # Additional problematic bots from your logs
        ~*YisouSpider 1;
        ~*360Spider 1;
        # Very old browsers (likely bots)
        ~*Chrome/[1-4][0-9]\. 1;
        ~*Chrome/5[0-9]\. 1;
        # Suspicious patterns
        ~*Quark.*Android.*zh-CN 1;
        ~*YaBrowser.*Yowser 1;
    }

    # Map to identify legitimate monitoring bots to allow
    map $http_user_agent $allow_monitor {
        default 0;
        ~*UptimeRobot 1;
        ~*Pingdom 1;
        ~*StatusCake 1;
        ~*Site24x7 1;
        ~*Googlebot 1;
        ~*Bingbot 1;
    }

    # Final decision: block if bad bot and not monitoring
    map $block_ua$allow_monitor $final_block {
        default 0;
        10 1;  # block_ua=1, allow_monitor=0 -> block
        11 0;  # block_ua=1, allow_monitor=1 -> allow (shouldn't happen but safe)
    }

    # Shared location block for proxy settings
    map $host $backend_port {
        fb-textpresso.alliancegenome.org 81;
        zfin-textpresso.alliancegenome.org 82;
        mgi-textpresso.alliancegenome.org 83;
        mgi-textpresso-combined.alliancegenome.org 83;
        wb-textpresso.alliancegenome.org 84;
        wb-textpresso-combined.alliancegenome.org 84;
        sgd-textpresso.alliancegenome.org 85;
        sgd-textpresso-combined.alliancegenome.org 85;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name fb-textpresso.alliancegenome.org;

        # Block bots
        if ($final_block) {
            return 444;
        }

        # Rate limiting
        limit_req zone=api burst=10 nodelay;
        limit_req zone=search burst=5 nodelay;

        location / {
           proxy_pass http://172.17.0.1:81;
           proxy_http_version 1.1;
           proxy_set_header Upgrade $http_upgrade;
           proxy_set_header Connection "upgrade";
           proxy_set_header "Access-Control-Allow-Origin" "*";
           proxy_set_header 'Access-Control-Allow-Credentials' 'true';
           proxy_set_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
           proxy_set_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With';
           proxy_set_header X-Forwarded-Proto $scheme;
           proxy_redirect off;
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Host $server_name;
        }

        # Stricter rate limiting for search endpoints
        location ~* /tpc.*search {
            limit_req zone=search burst=3 nodelay;
            proxy_pass http://172.17.0.1:81;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header "Access-Control-Allow-Origin" "*";
            proxy_set_header 'Access-Control-Allow-Credentials' 'true';
            proxy_set_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            proxy_set_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With';
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
        }
    }

